# MODO FREE — sem cartao, e o banco mora FORA do Render.
#
# O plano free do Render NAO TEM background worker, e sem worker o produto nao
# funciona: toda geracao de IA e um job, e o usuario ficaria olhando um spinner
# eterno. Entao aqui e UM servico so, e o container roda o servidor E a fila, sob
# supervisao (docker/supervisord.conf).
#
# O Postgres free do RENDER expira em 30 dias e depois e APAGADO — nao suspenso,
# apagado. Por isso o banco nao esta mais aqui: hoje e um Postgres free do NEON,
# que nao expira. O custo dessa escolha e que ele deixou de ser declarado neste
# arquivo — `DB_URL` e `sync: false` e vive so no painel. Ver docs/DEPLOY.md.
#
# O preco disso, honestamente:
#   - o servico DORME apos 15 min sem trafego; o primeiro acesso depois demora ~1min,
#     e um job enfileirado so anda quando alguem acorda o servico;
#   - o Neon suspende o compute apos 5 min ocioso, entao o primeiro acesso ainda
#     paga um cold start do banco por cima disso.
#
# NAO ponha um pinger para manter a demo acordada. Com o servico de pe, o
# `queue:work` polla o banco sem parar, o compute do Neon nunca suspende, e os
# 100 CU-hrs/mes do free (a 0.25 CU minimo) acabam em ~17 dias. O sono dos dois
# lados e o que mantem isto de graca.
#
# Serve para validar e para mostrar. Para um cliente de verdade, use o
# `render.production.yaml` (web + worker + Postgres pagos, cada um US$7): la nada
# dorme, nada expira, e a fila e um processo proprio.

services:
  - type: web
    name: 2m-social-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    # Sem `dockerCommand`: ele SUBSTITUI o ENTRYPOINT da imagem, e foi assim que o
    # primeiro deploy subiu com o banco vazio (caches e migrate nunca rodaram). Quem
    # manda agora e o ROLE — ver docker/start.sh.
    envVars:
      # Sem ROLE: o default e "servidor + fila no mesmo container" (o free nao tem
      # background worker).
      - key: RUN_MIGRATIONS
        value: true

      - key: APP_NAME
        value: 2M Social AI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # `php artisan key:generate --show`
      - key: APP_KEY
        sync: false
      # A URL publica so existe depois do primeiro deploy: preencher no painel.
      - key: APP_URL
        sync: false

      # O banco e do Neon, entao nao ha `fromDatabase` para ler daqui: o valor e
      # preenchido no painel. Use a string DIRETA do Neon, nao a `-pooler`: o
      # pooler e PgBouncer em modo transacao, e o `migrate --force` do start.sh
      # com os prepared statements do PDO nao sobrevive a isso.
      # O Laravel aceita a conexao inteira: config/database.php le `DB_URL`
      # (postgres://...) antes de DB_HOST/DB_PORT.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false

      # Fila, cache e sessao no banco: sem Redis no MVP (ADR).
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database

      # A IA roda de verdade. Cada geracao custa: estrategia ~4 centavos, lote de
      # copy ~6. O teto mensal por workspace e a defesa. Para validar a infra sem
      # gastar, troque para `mock` no painel — nenhum codigo muda.
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_WORKSPACE_MONTHLY_BUDGET_CENTS
        value: 5000

      # O servico e PUBLICO. Sem esta lista o cadastro fica aberto, e cada
      # workspace novo ganha o proprio teto de orcamento — ou seja, qualquer um
      # gastando a chave acima. Preencher no painel com os emails que podem
      # criar conta (virgula separa).
      - key: REGISTRATION_ALLOWED_EMAILS
        sync: false

      - key: LOG_CHANNEL
        value: stderr
