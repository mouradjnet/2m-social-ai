# O Nginx da STACK (dentro do Docker). Quem fala HTTPS com o mundo e o nginx do 2M Prev;
# este recebe dele, pela rede 2m-prev_internal (apelido social-ai-web), e reparte o trafego.

# O proxy da VPS diz se o acesso original foi https. Sem ele (curl direto na porta
# local), vale o esquema desta conexao.
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Upload da biblioteca: 8 MB por imagem e 300 MB por video de Reel (tetos da
    # Meta); a folga cobre o multipart. O PHP tem o mesmo teto (docker/php-uploads.ini).
    client_max_body_size 310m;

    # As imagens publicas — o que a Meta busca na hora de publicar. Direto do volume,
    # sem PHP. O nome do arquivo e um uuid e nunca muda: cache longo e seguro.
    location /storage/ {
        alias /var/www/media/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        # Nao `app`: na rede do 2M Prev esse nome e de outro sistema (ver o compose).
        # O nome e resolvido por requisicao (DNS do Docker): com nome fixo o nginx
        # guarda o IP de quando subiu, e o app recriado com outro IP vira 502.
        resolver 127.0.0.11 valid=10s;
        set $social_ai_app http://social-ai-app:8080;
        proxy_pass $social_ai_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_set_header X-Forwarded-Host $host;
        # Geracao de IA roda em fila (202 + polling), entao nenhuma requisicao
        # legitima demora; 60 s e folga.
        proxy_read_timeout 60s;
    }
}
