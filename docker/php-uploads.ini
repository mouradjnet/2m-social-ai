; Limites de upload da biblioteca. Sem este arquivo valem os padroes do PHP
; (upload_max_filesize=2M, post_max_size=8M): toda imagem acima de 2 MB era
; recusada pelo PHP antes de chegar ao Laravel, apesar do teto de 8 MB da Meta.
; O Reel pode ter ate 300 MB (limite da Meta); a folga cobre o multipart.
; O teste DockerUploadLimitsTest confere que estes numeros cobrem config/media.php.
upload_max_filesize = 310M
post_max_size = 320M
; O GD reencoda a imagem em memoria: uma foto de celular de 8 MB descomprime para
; ~100 MB de pixels. O padrao de 128M nao comporta.
memory_limit = 384M
max_execution_time = 120
max_input_time = 120
