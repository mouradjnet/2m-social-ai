; Modo FREE do Render: um servico so, dois processos.
;
; O plano free nao tem background worker — e sem worker o produto NAO FUNCIONA:
; toda geracao de IA e um job, e o usuario ficaria olhando um spinner eterno. Entao
; o mesmo container roda o servidor e a fila, sob supervisao.
;
; No plano pago isto nao e usado: la o worker e um servico proprio, com a mesma
; imagem (ver render.production.yaml).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:frankenphp]
; A porta vem do ambiente: o Render injeta $PORT (10000) e roteia SO para ela.
; Escutar numa porta fixa faz o painel dizer "deploy live" enquanto toda requisicao
; volta 404 com `x-render-routing: no-server` — ninguem para rotear.
; O ENV PORT=8080 do Dockerfile e o default para rodar a imagem fora do Render.
command=frankenphp php-server --root /app/public --listen :%(ENV_PORT)s
autostart=true
autorestart=true
; Se o servidor morrer, o container inteiro deve cair: o Render reinicia e o
; healthcheck volta a fazer sentido. Um container "vivo" sem servidor e pior.
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:queue]
command=php /app/artisan queue:work --tries=1 --timeout=180
directory=/app
autostart=true
autorestart=true
user=www-data
; `--tries=1`: o RunAgentJob ja trata as proprias falhas (marca o ai_run como failed
; com o error_code). Retentar o job chamaria — e cobraria — a API da Anthropic de novo.
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
